document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"bb831d9d-eb9b-41d0-841b-c124975bac9b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: #0B1A2E; font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", system-ui, Roboto, Helvetica, Arial, sans-serif; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"ea70d545-8720-44ac-a593-541d240533b7#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" no-rail=\"\" data-uneditable=\"\">\n\n<!-- ════════════ 01 · TITLE ════════════ -->\n\n\n<!-- ════════════ 02 · HOOK ════════════ -->\n<section data-label=\"Hook\" data-speaker-notes=\"Wir tracken längst alles, Schritte, Schlaf, Puls.\nAusgerechnet die Generation\nAngehörige merken eine Verschlechterung oft erst, wenn zu spät\nBewegung verrät früh, wenn etwas kippt, solange noch Zeit ist, etwas zu ändern.\" style=\"background:linear-gradient(165deg,#0E2A47 0%,#163B66 100%);color:#FFFFFF;box-sizing:border-box;padding:0;display:flex;\">\n  <div style=\"flex:1.16;display:flex;flex-direction:column;justify-content:center;padding:110px 84px 110px 120px;\">\n    <span style=\"font-size:24px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#F2B705;margin-bottom:38px;\">Der blinde Fleck<\u002Fspan>\n    <h2 style=\"font-size:92px;font-weight:700;line-height:1.04;letter-spacing:-0.025em;margin:0;color:#FFFFFF;\">Smarte Rollatoren<\u002Fh2>\n    \n  <\u002Fdiv>\n  <div style=\"flex:0.84;position:relative;background:repeating-linear-gradient(135deg,rgba(255,255,255,0.05) 0 1px,transparent 1px 15px),rgba(255,255,255,0.05);display:flex;align-items:flex-end;justify-content:center;padding:46px;border-left:1px solid rgba(255,255,255,0.1);\">\n    <span style=\"font-size:24px;letter-spacing:0.02em;color:rgba(255,255,255,0.7);text-align:center;background:rgba(255,255,255,0.08);padding:13px 19px;border-radius:12px;\">FOTO · Ältere Person mit Rollator<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ 03 · PROBLEM ════════════ -->\n<section data-label=\"Problem\" data-speaker-notes=\"Aktuell 6 Mio\nDemografischer Wandel: mehr Ältere, weniger Pflegekräfte, die Pflege ist schon jetzt überlastet. \n\nSelbstbestimmt leben\n\nentlastet das System und lebt besser. Win-win.\n\nTypischer\" style=\"background:#F4F6F9;color:#1A2230;box-sizing:border-box;padding:80px 110px 68px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid #E6EAF1;\">\n    <span style=\"font-size:24px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#163B66;\">Das Problem<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:11px;\"><img src=\"7467b3f8-fb79-4693-91d0-47f0c426fd77\" alt=\"\" style=\"width:34px;height:34px;border-radius:9px;\"><span style=\"font-size:26px;font-weight:700;letter-spacing:-0.01em;color:#0E2A47;\">Hiptron<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:64px;font-weight:700;line-height:1.05;letter-spacing:-0.02em;margin:44px 0 0;color:#0E2A47;max-width:1180px;\">Mobilität sinkt schleichend, meist unbemerkt.<\u002Fh2>\n  <div style=\"flex:1;display:flex;align-items:center;gap:72px;padding-top:8px;\">\n    <div style=\"flex:1.16;display:flex;flex-direction:column;\">\n      <svg viewBox=\"0 0 560 250\" style=\"width:100%;height:auto;\" preserveAspectRatio=\"xMidYMid meet\">\n        <defs>\n          <linearGradient id=\"mobSlideFill\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n            <stop offset=\"0%\" stop-color=\"#1F5FE0\" stop-opacity=\"0.13\"><\u002Fstop>\n            <stop offset=\"100%\" stop-color=\"#1F5FE0\" stop-opacity=\"0\"><\u002Fstop>\n          <\u002FlinearGradient>\n        <\u002Fdefs>\n        <line x1=\"10\" y1=\"236\" x2=\"550\" y2=\"236\" stroke=\"#D5DCE6\" stroke-width=\"1.5\" stroke-dasharray=\"2 8\"><\u002Fline>\n        <path d=\"M16,58 C120,76 230,128 312,152 L312,236 L16,236 Z\" fill=\"url(#mobSlideFill)\"><\u002Fpath>\n        <path d=\"M16,58 C120,76 230,128 312,152\" fill=\"none\" stroke=\"#1F5FE0\" stroke-width=\"4\" stroke-linecap=\"round\"><\u002Fpath>\n        <line x1=\"312\" y1=\"92\" x2=\"312\" y2=\"220\" stroke=\"#CBA94E\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\"><\u002Fline>\n        <path d=\"M312,152 C360,166 458,184 544,196\" fill=\"none\" stroke=\"#DD8A12\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n        <circle cx=\"312\" cy=\"152\" r=\"8\" fill=\"#F2B705\" stroke=\"#F4F6F9\" stroke-width=\"2.5\"><\u002Fcircle>\n        <text x=\"312\" y=\"80\" font-size=\"24\" font-weight=\"700\" fill=\"#8A6400\" text-anchor=\"middle\">Veränderung<\u002Ftext>\n      <\u002Fsvg>\n      <div style=\"display:flex;justify-content:space-between;font-size:24px;color:#525C6B;margin-top:14px;\">\n        <span>Mobilität sinkt schleichend<\u002Fspan>\n        <span style=\"color:#8A6400;font-weight:600;\">Früh sichtbar — solange noch Zeit bleibt<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:0.84;\">\n      <div style=\"font-size:150px;font-weight:700;line-height:0.92;letter-spacing:-0.03em;color:#0E2A47;\">+1,8 Mio.<\u002Fdiv>\n      <div style=\"font-size:33px;line-height:1.4;color:#1A2230;margin-top:18px;max-width:440px;\">Pflegebedürftige zusätzlich in Deutschland bis 2055.<\u002Fdiv>\n      <div style=\"font-size:24px;color:#525C6B;margin-top:14px;\">Destatis · Projektion 2023<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ 04 · LÖSUNG ════════════ -->\n<section data-label=\"Lösung\" data-speaker-notes=\"Hiptron hat ein Sensor-Modul gebaut, nachrüstbar an jeden Rollator. Kein neuer Rollator, keine Umgewöhnung. Es zeichnet die Position im normalen Alltag auf. Rohe Positionen helfen niemandem. Da kommen wir ins Spiel: wir haben die Mustererkennung gebaut. Aus Positionen werden Bewegungsmuster über Wochen. Und das läuft wirklich.\" style=\"background:#F4F6F9;color:#1A2230;box-sizing:border-box;padding:80px 110px 68px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid #E6EAF1;\">\n    <span style=\"font-size:24px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#163B66;\">Die Lösung<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:11px;\"><img src=\"7467b3f8-fb79-4693-91d0-47f0c426fd77\" alt=\"\" style=\"width:34px;height:34px;border-radius:9px;\"><span style=\"font-size:26px;font-weight:700;letter-spacing:-0.01em;color:#0E2A47;\">Hiptron<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:64px;font-weight:700;line-height:1.05;letter-spacing:-0.02em;margin:40px 0 0;color:#0E2A47;\">Ein Modul am Rollator. Bedeutung in den Daten.<\u002Fh2>\n\n  <!-- drei Schritte -->\n  <div style=\"display:flex;align-items:flex-start;justify-content:center;gap:0;margin:auto 0;\">\n    <!-- Schritt 1: Rollator -->\n    <div style=\"flex:1;display:flex;flex-direction:column;\">\n      <span style=\"font-size:24px;font-weight:700;letter-spacing:0.1em;color:#8A6400;margin-bottom:12px;\">SCHRITT 1<\u002Fspan>\n      <div style=\"height:288px;border-radius:24px;border:1px solid #E6EAF1;background:#FFFFFF;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 6px 20px rgba(16,32,60,0.06);\">\n        <img src=\"3825f3f0-5870-41a1-974f-9d501447faf5\" alt=\"Sensor-Modul am Rollator-Rohr\" style=\"width:100%;height:100%;object-fit:contain;object-position:center;display:block;\">\n      <\u002Fdiv>\n      <div style=\"font-size:27px;color:#1E8E3E;margin-top:16px;font-weight:600;line-height:1.3;\">Nachrüstbar an jeden Rollator.<\u002Fdiv>\n    <\u002Fdiv>\n    <!-- Pfeil: GPS-Daten -->\n    <div style=\"flex:0 0 150px;height:332px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;\">\n      <span style=\"font-size:50px;color:#1F5FE0;line-height:1;\">→<\u002Fspan>\n      <span style=\"font-size:24px;color:#525C6B;text-align:center;line-height:1.25;\">GPS-Daten<\u002Fspan>\n    <\u002Fdiv>\n    <!-- Schritt 2: Karte -->\n    <div style=\"flex:1.25;display:flex;flex-direction:column;\">\n      <span style=\"font-size:24px;font-weight:700;letter-spacing:0.1em;color:#8A6400;margin-bottom:12px;\">SCHRITT 2<\u002Fspan>\n      <div style=\"height:288px;border-radius:24px;overflow:hidden;border:1px solid #E6EAF1;background:#E7EDF3;position:relative;box-shadow:0 6px 20px rgba(16,32,60,0.06);\">\n        <img src=\"7ed53a23-c73c-4cd3-b88a-e88137b5319c\" alt=\"Bewegungskarte: Zuhause und häufige Orte mit letzter Route\" style=\"width:100%;height:100%;object-fit:cover;object-position:center;display:block;\">\n      <\u002Fdiv>\n      <div style=\"font-size:27px;color:#1A2230;margin-top:16px;font-weight:600;line-height:1.3;\">Bewegungskarte aus dem Alltag.<\u002Fdiv>\n    <\u002Fdiv>\n    <!-- Pfeil: Mustererkennung & Analyse -->\n    <div style=\"flex:0 0 150px;height:332px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;\">\n      <span style=\"font-size:50px;color:#1F5FE0;line-height:1;\">→<\u002Fspan>\n      <span style=\"font-size:24px;color:#525C6B;text-align:center;line-height:1.25;\">Mustererkennung<br>&amp; Analyse<\u002Fspan>\n    <\u002Fdiv>\n    <!-- Schritt 3: Graph -->\n    <div style=\"flex:1.25;display:flex;flex-direction:column;\">\n      <span style=\"font-size:24px;font-weight:700;letter-spacing:0.1em;color:#8A6400;margin-bottom:12px;\">SCHRITT 3<\u002Fspan>\n      <div style=\"height:288px;border-radius:24px;border:1px solid #E6EAF1;background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:30px 28px;box-shadow:0 6px 20px rgba(16,32,60,0.06);\">\n        <svg viewBox=\"0 0 560 200\" style=\"width:100%;height:auto;\" preserveAspectRatio=\"xMidYMid meet\">\n          <line x1=\"8\" y1=\"72\" x2=\"552\" y2=\"72\" stroke=\"#C3D0DE\" stroke-width=\"1.5\" stroke-dasharray=\"3 7\"><\u002Fline>\n          <path d=\"M12,74 L150,70 L300,76 L360,104 L440,150 L548,176\" fill=\"none\" stroke=\"#1F5FE0\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <line x1=\"300\" y1=\"20\" x2=\"300\" y2=\"186\" stroke=\"#F2B705\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\"><\u002Fline>\n          <circle cx=\"300\" cy=\"76\" r=\"8\" fill=\"#F2B705\"><\u002Fcircle>\n          <text x=\"312\" y=\"40\" font-size=\"24\" font-weight=\"600\" fill=\"#8A6400\">Knickpunkt<\u002Ftext>\n          <text x=\"14\" y=\"58\" font-size=\"24\" fill=\"#525C6B\">eigener Normalwert<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:27px;color:#1A2230;margin-top:16px;font-weight:600;line-height:1.3;\">Wie weit · wie oft · wie schnell · welche Orte. Und die Veränderung über Wochen.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ 06 · PRODUKT · SENIORIN ════════════ -->\n<section data-label=\"Angehörige\" data-speaker-notes=\"Die Angehörigen brauchen Ruhe und Klarheit, nie einen Rohdaten-Dump. Oben ein Status, eine Zusammenfassung in einem Satz. Die Leitfrage: Gab es kürzlich Veränderungen? Wenn ja, eine ruhige Karte in Klartext, keine Risiko-Prozente. Die Karte zeigt den letzten Ausgang als Kontext, kein Live-Tracking. Consent zeigen, nicht behaupten: sie hat zugestimmt, sieht ihre Daten, kann abschalten.\" style=\"background:#F4F6F9;color:#1A2230;box-sizing:border-box;padding:80px 110px 64px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid #E6EAF1;\">\n    <span style=\"font-size:24px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#163B66;\">Produkt · Angehörige<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:11px;\"><img src=\"7467b3f8-fb79-4693-91d0-47f0c426fd77\" alt=\"\" style=\"width:34px;height:34px;border-radius:9px;\"><span style=\"font-size:26px;font-weight:700;letter-spacing:-0.01em;color:#0E2A47;\">Hiptron<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:74px;padding-top:14px;\">\n    <div style=\"width:430px;flex-shrink:0;background:#0E2A47;border:1px solid #0B1A2E;border-radius:48px;padding:14px;box-shadow:0 26px 60px rgba(14,42,71,0.28),0 4px 14px rgba(14,42,71,0.12);\">\n      <iframe src=\"https://orfrederick.github.io/Hiptron/#/relative?u=helga&amp;embed=1\" title=\"Angehörige-Home (live)\" loading=\"eager\" scrolling=\"auto\" style=\"width:402px;height:800px;border:none;border-radius:34px;background:#F4F6F9;display:block;overflow:auto;\"><\u002Fiframe>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;\">\n      <h2 style=\"font-size:60px;font-weight:700;line-height:1.04;letter-spacing:-0.02em;margin:0;color:#0E2A47;\">Klarheit statt Dauersorge.<\u002Fh2>\n      \n      <div style=\"background:#FCF3D6;border-left:5px solid #F2B705;border-radius:6px 18px 18px 6px;padding:28px 32px;margin-top:18px;\">\n        <div style=\"font-size:24px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#8A6400;\">Beobachtung<\u002Fdiv>\n        <div style=\"font-size:35px;line-height:1.35;color:#1A2230;font-weight:600;margin-top:10px;\">Helga geht zur Zeit kürzere Strecken als sonst. Vorher waren es etwa 1,7 km am Tag.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;margin-top:22px;\">\n        <div style=\"flex:1;background:#FFFFFF;border:1px solid #E6EAF1;border-radius:14px;padding:18px 22px;box-shadow:0 1px 3px rgba(16,32,60,0.04);\">\n          <div style=\"font-size:42px;font-weight:700;color:#0E2A47;line-height:1;\">550 m<\u002Fdiv>\n          <div style=\"font-size:22px;color:#525C6B;margin-top:8px;line-height:1.3;\">diese Woche im Schnitt · sonst 1,7 km<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:#FFFFFF;border:1px solid #E6EAF1;border-radius:14px;padding:18px 22px;box-shadow:0 1px 3px rgba(16,32,60,0.04);\">\n          <div style=\"font-size:42px;font-weight:700;color:#0E2A47;line-height:1;\">68 % ↓<\u002Fdiv>\n          <div style=\"font-size:22px;color:#525C6B;margin-top:8px;line-height:1.3;\">Gehstrecke unter ihrem eigenen Normal<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:#FFFFFF;border:1px solid #E6EAF1;border-radius:14px;padding:18px 22px;box-shadow:0 1px 3px rgba(16,32,60,0.04);\">\n          <div style=\"font-size:42px;font-weight:700;color:#0E2A47;line-height:1;\">15 % ↓<\u002Fdiv>\n          <div style=\"font-size:22px;color:#525C6B;margin-top:8px;line-height:1.3;\">kleinerer Bewegungsradius · näher an zuhause<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;margin-top:20px;color:#1F5FE0;\">\n        <span style=\"font-size:26px;line-height:1;\">›<\u002Fspan>\n        <span style=\"font-size:25px;color:#525C6B;line-height:1.3;\">und viele weitere Kennzahlen samt Trendanalyse über Wochen.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection><section data-label=\"Seniorin\" data-speaker-notes=\"Dieselben Bewegungsdaten, zwei völlig verschiedene Aufgaben, also zwei Apps. Die ältere Person braucht Ermutigung. Warm und persönlich: Tagesgruß, der Spaziergang von gestern, eine Streak, ein Highlight pro Woche. Keine Scores, keine Diagnosen, keine Warnungen. Sie ist Protagonistin, kein Patient. Live-Screen, kein Mockup.\" style=\"background:#F4F6F9;color:#1A2230;box-sizing:border-box;padding:80px 110px 68px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid #E6EAF1;\">\n    <span style=\"font-size:24px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#163B66;\">Produkt · Seniorin<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:11px;\"><img src=\"7467b3f8-fb79-4693-91d0-47f0c426fd77\" alt=\"\" style=\"width:34px;height:34px;border-radius:9px;\"><span style=\"font-size:26px;font-weight:700;letter-spacing:-0.01em;color:#0E2A47;\">Hiptron<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:80px;padding-top:16px;\">\n    <div style=\"width:430px;flex-shrink:0;background:#0E2A47;border:1px solid #0B1A2E;border-radius:48px;padding:14px;box-shadow:0 26px 60px rgba(14,42,71,0.28),0 4px 14px rgba(14,42,71,0.12);\">\n      <iframe src=\"https://orfrederick.github.io/Hiptron/#/older-adult?u=helga&amp;embed=1\" title=\"Senioren-Home (live)\" loading=\"eager\" scrolling=\"auto\" style=\"width:402px;height:800px;border:none;border-radius:34px;background:#F4F6F9;display:block;overflow:auto;\"><\u002Fiframe>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;\">\n      <h2 style=\"font-size:62px;font-weight:700;line-height:1.04;letter-spacing:-0.02em;margin:0;color:#0E2A47;\"><\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:24px;margin-top:42px;\">\n        <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#34A853;margin-top:13px;flex-shrink:0;\"><\u002Fspan><span style=\"font-size:31px;color:#1A2230;line-height:1.4;\">Ermutigung, keine Diagnose.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#34A853;margin-top:13px;flex-shrink:0;\"><\u002Fspan><span style=\"font-size:31px;color:#1A2230;line-height:1.4;\">Unkompliziert und übersichtlich.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:18px;align-items:flex-start;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#34A853;margin-top:13px;flex-shrink:0;\"><\u002Fspan><span style=\"font-size:31px;color:#1A2230;line-height:1.4;\">Zeigt, wie viele Tage am Stück sie schon draußen war.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:46px;max-width:780px;\">\n        <div style=\"font-size:33px;line-height:1.4;color:#1E8E3E;font-weight:600;\">Keine Bewertungen, keine Warnungen. Die App bestärkt Helga jeden Tag, aktiv und selbstständig zu bleiben.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ 07 · PRODUKT · ANGEHÖRIGE ════════════ -->\n\n\n<!-- ════════════ 08 · WAS WIR MACHEN — UND WAS NICHT ════════════ -->\n\n\n<!-- ════════════ 09 · MARKT ════════════ -->\n<section data-label=\"Markt\" data-speaker-notes=\"Marktgröße über Betroffenenzahlen, keine Kostenanalyse. Rund 2 Millionen Rollatoren, etwa 6 Millionen Ältere leben allein, 3,1 Millionen werden ausschließlich von Angehörigen versorgt. Käufer sind Senioren und ihre Angehörigen, unser Beitrag ist die Mustererkennung.\" style=\"background:#F4F6F9;color:#1A2230;box-sizing:border-box;padding:80px 110px 72px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid #E6EAF1;\">\n    <span style=\"font-size:24px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#163B66;\">Markt<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:11px;\"><img src=\"7467b3f8-fb79-4693-91d0-47f0c426fd77\" alt=\"\" style=\"width:34px;height:34px;border-radius:9px;\"><span style=\"font-size:26px;font-weight:700;letter-spacing:-0.01em;color:#0E2A47;\">Hiptron<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:64px;font-weight:700;line-height:1.05;letter-spacing:-0.02em;margin:42px 0 0;color:#0E2A47;\">Ein wachsender Bedarf.<\u002Fh2>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px;max-width:1340px;\">\n    <div style=\"display:flex;align-items:center;gap:48px;\"><span style=\"font-size:108px;font-weight:700;color:#0E2A47;line-height:0.9;letter-spacing:-0.025em;width:360px;flex-shrink:0;text-align:right;white-space:nowrap;\">~2 Mio.<\u002Fspan><span style=\"font-size:34px;color:#1A2230;line-height:1.3;\">Rollatoren in Deutschland<\u002Fspan><\u002Fdiv>\n    <div style=\"height:1px;background:#E6EAF1;\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:48px;\"><span style=\"font-size:108px;font-weight:700;color:#0E2A47;line-height:0.9;letter-spacing:-0.025em;width:360px;flex-shrink:0;text-align:right;white-space:nowrap;\">~6 Mio.<\u002Fspan><span style=\"font-size:34px;color:#1A2230;line-height:1.3;\">Ältere leben allein, 34 % der über 65-Jährigen.<\u002Fspan><\u002Fdiv>\n    <div style=\"height:1px;background:#E6EAF1;\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:48px;\"><span style=\"font-size:108px;font-weight:700;color:#0E2A47;line-height:0.9;letter-spacing:-0.025em;width:360px;flex-shrink:0;text-align:right;white-space:nowrap;\">3,1 Mio.<\u002Fspan><span style=\"font-size:34px;color:#1A2230;line-height:1.3;\">werden ausschließlich von Angehörigen versorgt.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding-top:26px;border-top:1px solid #E6EAF1;font-size:28px;color:#525C6B;line-height:1.4;\">Käufer sind Senioren und ihre Angehörigen — unser Beitrag ist die Mustererkennung.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ 10 · ROADMAP ════════════ -->\n<section data-label=\"Roadmap\" data-speaker-notes=\"Nächster Schritt: ein 8-Wochen-Pilot mit echten Nutzern, um die Signale an echten Daten zu validieren, im Co-Design mit Älteren und Angehörigen. Heute steht ein funktionsfähiger Prototyp mit echter Pipeline auf realitätsnahen Personas. Möglich machen den Pilot Kontakte zu Sanitätshaus, Pflegedienst oder Quartiersprojekt.\" style=\"background:#F4F6F9;color:#1A2230;box-sizing:border-box;padding:80px 110px 72px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid #E6EAF1;\">\n    <span style=\"font-size:24px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#163B66;\">Roadmap<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:11px;\"><img src=\"7467b3f8-fb79-4693-91d0-47f0c426fd77\" alt=\"\" style=\"width:34px;height:34px;border-radius:9px;\"><span style=\"font-size:26px;font-weight:700;letter-spacing:-0.01em;color:#0E2A47;\">Hiptron<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:64px;font-weight:700;line-height:1.05;letter-spacing:-0.02em;margin:42px 0 0;color:#0E2A47;\">Ein klarer nächster Schritt.<\u002Fh2>\n  <div style=\"flex:1;display:flex;align-items:stretch;gap:0;padding-top:44px;\">\n    <div style=\"flex:1;background:#FFFFFF;border:1px solid #E6EAF1;border-top:5px solid #9AA6B5;border-radius:8px 8px 22px 22px;padding:38px 36px;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(16,32,60,0.06);\">\n      <span style=\"font-size:24px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#6B7686;\">Phase 1 · Heute<\u002Fspan>\n      <div style=\"font-size:38px;font-weight:700;color:#0E2A47;line-height:1.12;margin-top:14px;\">Funktionsfähiger Prototyp<\u002Fdiv>\n      <div style=\"font-size:27px;color:#525C6B;line-height:1.4;margin-top:16px;\">Echte Pipeline, lauffähig auf realitätsnahen, synthetischen Personas.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;padding:0 14px;color:#1F5FE0;font-size:38px;\">→<\u002Fdiv>\n    <div style=\"flex:1.06;background:linear-gradient(165deg,#0E2A47 0%,#163B66 100%);border:1px solid #0E2A47;border-radius:8px 8px 22px 22px;padding:38px 36px;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(14,42,71,0.24);\">\n      <span style=\"font-size:24px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#F2B705;\">Phase 2 · Nächster Schritt<\u002Fspan>\n      <div style=\"font-size:38px;font-weight:700;color:#FFFFFF;line-height:1.12;margin-top:14px;\">8-Wochen-Pilot<\u002Fdiv>\n      <div style=\"font-size:27px;color:rgba(255,255,255,0.82);line-height:1.4;margin-top:16px;\">Im echten Alltag, im Co-Design mit Älteren und Angehörigen.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;padding:0 14px;color:#1F5FE0;font-size:38px;\">→<\u002Fdiv>\n    <div style=\"flex:1;background:#FFFFFF;border:1px solid #E6EAF1;border-top:5px solid #34A853;border-radius:8px 8px 22px 22px;padding:38px 36px;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(16,32,60,0.06);\">\n      <span style=\"font-size:24px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#1E8E3E;\">Phase 3 · Danach<\u002Fspan>\n      <div style=\"font-size:38px;font-weight:700;color:#0E2A47;line-height:1.12;margin-top:14px;\">Validieren &amp; schärfen<\u002Fdiv>\n      <div style=\"font-size:27px;color:#525C6B;line-height:1.4;margin-top:16px;\">Signale an echten Daten. Partner: Sanitätshaus, Pflegedienst, Quartier.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ 11 · CLOSE ════════════ -->\n<section data-label=\"Abschluss\" data-speaker-notes=\"Callback zum Hook. Wie viel bewegt sich deine Oma? Mit Hiptron könntest du es wissen. Früh genug, um noch etwas zu ändern. Würde, Selbstständigkeit, Ruhe für die Familie.\" style=\"background:linear-gradient(165deg,#0E2A47 0%,#163B66 100%);color:#FFFFFF;box-sizing:border-box;padding:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;\">\n  <svg width=\"420\" height=\"420\" viewBox=\"0 0 420 420\" aria-hidden=\"true\" style=\"position:absolute;bottom:-110px;left:-80px;opacity:0.85;\"><circle cx=\"130\" cy=\"300\" r=\"92\" fill=\"rgba(242,183,5,0.13)\"><\u002Fcircle><circle cx=\"130\" cy=\"300\" r=\"52\" fill=\"rgba(242,183,5,0.17)\"><\u002Fcircle><\u002Fsvg>\n  <h2 style=\"font-size:80px;font-weight:700;line-height:1.12;letter-spacing:-0.025em;margin:0;color:#FFFFFF;max-width:1500px;position:relative;\">Wie viel bewegt sich deine Oma? Mit Hiptron könntest du es wissen.<\u002Fh2>\n  <p style=\"font-size:38px;line-height:1.4;color:rgba(255,255,255,0.78);margin:40px 0 0;position:relative;\">Früh genug, um noch etwas zu ändern.<\u002Fp>\n  <div style=\"width:60px;height:2px;background:rgba(255,255,255,0.28);margin:54px 0;position:relative;\"><\u002Fdiv>\n  <p style=\"font-size:28px;letter-spacing:0.05em;color:#F2B705;font-weight:600;margin:0;position:relative;\">Würde &nbsp;·&nbsp; Selbstständigkeit &nbsp;·&nbsp; Ruhe für die Familie<\u002Fp>\n  <div style=\"display:flex;align-items:center;gap:14px;margin-top:62px;position:relative;\">\n    <img src=\"7467b3f8-fb79-4693-91d0-47f0c426fd77\" alt=\"Hiptron\" style=\"width:44px;height:44px;border-radius:12px;\">\n    <span style=\"font-size:32px;font-weight:700;letter-spacing:-0.01em;color:#FFFFFF;\">Hiptron<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ 12 · QUELLEN ════════════ -->\n<section data-label=\"Quellen\" data-speaker-notes=\"Backup-Folie. Volle Angaben im Skript. Quellen verifiziert: Gehgeschwindigkeit und Überleben, sechstes Vitalzeichen, WHO Sturzrate, Life-space-Mobilität, soziale Isolation, IANA-Task-Force, Destatis.\" style=\"background:#F4F6F9;color:#1A2230;box-sizing:border-box;padding:80px 110px 72px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid #E6EAF1;\">\n    <span style=\"font-size:24px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#163B66;\">BACKUP<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:11px;\"><img src=\"7467b3f8-fb79-4693-91d0-47f0c426fd77\" alt=\"\" style=\"width:34px;height:34px;border-radius:9px;\"><span style=\"font-size:26px;font-weight:700;letter-spacing:-0.01em;color:#0E2A47;\">Hiptron<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"font-size:54px;font-weight:700;line-height:1.1;letter-spacing:-0.02em;margin:40px 0 0;color:#0E2A47;\">Quellen.<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:30px 80px;align-content:center;\">\n    <div style=\"font-size:26px;line-height:1.5;color:#1A2230;\"><span style=\"color:#1F5FE0;font-weight:600;\">Gehgeschwindigkeit ↔ Überleben<\u002Fspan><br><span style=\"color:#525C6B;\">Studenski et al., JAMA 2011<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:26px;line-height:1.5;color:#1A2230;\"><span style=\"color:#1F5FE0;font-weight:600;\">Sechstes Vitalzeichen<\u002Fspan><br><span style=\"color:#525C6B;\">Fritz &amp; Lusardi, JGPT 2009<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:26px;line-height:1.5;color:#1A2230;\"><span style=\"color:#1F5FE0;font-weight:600;\">Sturzrate ab 65<\u002Fspan><br><span style=\"color:#525C6B;\">WHO, Falls Prevention 2007<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:26px;line-height:1.5;color:#1A2230;\"><span style=\"color:#1F5FE0;font-weight:600;\">Life-space ↔ Mortalität<\u002Fspan><br><span style=\"color:#525C6B;\">Mackey et al., JAGS 2014<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:26px;line-height:1.5;color:#1A2230;\"><span style=\"color:#1F5FE0;font-weight:600;\">Soziale Isolation ↔ Mortalität<\u002Fspan><br><span style=\"color:#525C6B;\">Holt-Lunstad et al., PLOS Med 2010<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:26px;line-height:1.5;color:#1A2230;\"><span style=\"color:#1F5FE0;font-weight:600;\">Gehgeschwindigkeit als Screening<\u002Fspan><br><span style=\"color:#525C6B;\">Abellan van Kan et al., IANA 2009<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:26px;line-height:1.5;color:#1A2230;\"><span style=\"color:#1F5FE0;font-weight:600;\">Demografie und Pflege<\u002Fspan><br><span style=\"color:#525C6B;\">Destatis, Pflegestatistik und Mikrozensus<\u002Fspan><\u002Fdiv>\n    \n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"

<script>

  function hasFS(){ return document.fullscreenEnabled || document.webkitFullscreenEnabled; }

      var t = document.documentElement;
      var r = t.requestFullscreen || t.webkitRequestFullscreen;

  function toggle(){ isOn() ? exit() : enter(); }

  function apply(){
    var on = isOn();
    post(on);
    if (btn) { btn.style.opacity = on ? "0" : ""; btn.style.pointerEvents = on ? "none" : ""; }

  document.addEventListener("fullscreenchange", apply);

  // 'F' toggles. deck-stage's key handler ignores F, so no conflict.

  btn.addEventListener("mouseenter", function(){ btn.style.background = "rgba(14,42,71,0.88)"; });
